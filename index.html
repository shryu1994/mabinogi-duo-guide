<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>크롬 바스 일반 · 닼메 + 세바</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="title"></h1>
      <div class="top-actions">
        <button id="btn-wake" class="ghost" aria-pressed="false" title="화면 켜짐 유지">화면 유지</button>
        <button id="btn-settings" class="ghost">설정</button>
        <button id="btn-newrun" class="ghost">새 판</button>
      </div>
    </div>
    <nav id="steps" class="steps" aria-label="단계"></nav>
  </header>

  <main id="deck" class="deck" tabindex="0" aria-live="polite"></main>

  <footer class="bottom">
    <button id="btn-prev" class="nav" aria-label="이전">‹</button>
    <div id="timer-strip" class="timer-strip"></div>
    <button id="btn-timers" class="nav small" aria-label="타이머 전체">⏱</button>
    <button id="btn-next" class="nav" aria-label="다음">›</button>
  </footer>

  <dialog id="dlg-settings">
    <form method="dialog">
      <h2>내 세팅</h2>
      <p class="hint">가진 펫·스킬만 켜 두면 카드에 그것만 보인다. 이 기기에만 저장된다.</p>
      <div id="settings-body"></div>
      <div class="dlg-actions"><button value="close">닫기</button></div>
    </form>
  </dialog>

  <dialog id="dlg-timers">
    <form method="dialog">
      <h2>타이머</h2>
      <p class="hint">누르면 시작, 다시 누르면 처음부터. 지속이 끝나면 쿨을 센다.</p>
      <div id="timers-body" class="timer-grid"></div>
      <div class="dlg-actions">
        <button type="button" id="btn-timers-reset" class="ghost">모두 끄기</button>
        <button value="close">닫기</button>
      </div>
    </form>
  </dialog>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
